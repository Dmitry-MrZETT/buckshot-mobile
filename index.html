<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Buckshot</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <div class="game">
        <div class="dealer-grid">
            <button class="dealer-items" id="dealer-1"></button>
            <button class="dealer-items" id="dealer-2"></button>
            <button class="dealer-items" id="dealer-3"></button>
            <button class="dealer-items" id="dealer-4"></button>
            <button id="dealer">
                <img src="assets/dealer.png">
            </button>
            <button class="dealer-items" id="dealer-5"></button>
            <button class="dealer-items" id="dealer-6"></button>
            <button class="dealer-items" id="dealer-7"></button>
            <button class="dealer-items" id="dealer-8"></button>
        </div>
        <div class="upper-line">
            <span id="text1">text1</span>
            <span id="text2">text2</span>
            <span id="text3">text3</span>
        </div>
        <div class="mid-grid">
            <span id="dealer-hp">1</span>
            <span id="player-hp">2</span>
            <button id="shotgun">
                <img src="assets/shotgun.png">
            </button>
            <span id="shells">0</span>
        </div>
        <div class="lower-line">
            <span id="console">lol</span>
        </div>
        <div class="player-grid">
            <button class="player-items" id="player-1"></button>
            <button class="player-items" id="player-2"></button>
            <button class="player-items" id="player-3"></button>
            <button class="player-items" id="player-4"></button>
            <button id="player">
                <img src="assets/player.png">
            </button>
            <button class="player-items" id="player-5"></button>
            <button class="player-items" id="player-6"></button>
            <button class="player-items" id="player-7"></button>
            <button class="player-items" id="player-8"></button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
